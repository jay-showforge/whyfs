[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whyfs"
version = "0.9.0.dev1"
description = "Automatic provenance labels for files: where, when, how, and what or who caused them to exist."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BUSL-1.1"}  # Business Source License 1.1: source available, not OSI open source
authors = [{name = "Jonathan Tyler Montgomery"}]
keywords = ["provenance", "lineage", "filesystem", "debugging", "reproducibility", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.scripts]
whyfs = "whyfs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
whyfs = ["libwhyfs.c", "native/whyfs-collect.c", "ui.html"]
