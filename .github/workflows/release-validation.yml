# Scoped native release validation for query-side changes (the label, history, impact, API).
# It keeps from native-validation: platform identity, the build, the test suites, the exact
# artifact's clean install and upgrade, the product / outage / corpus / secret / functional
# gates.  It adds the long-history label gate (scripts/label_latency_gate.py).  It leaves out
# the capture and performance campaigns (machine_perf 150 pairs, spawn stress, graduation):
# they measure the collectors, the writer and the service, which a query-side change does not
# touch.  Their authoritative results stay those of native-validation run 36462972085.
# Manual trigger only.
name: release-validation
on: [workflow_dispatch]

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: platform identity (must be native, not emulated)
        run: |
          mkdir -p ci-results
          { uname -a; dpkg --print-architecture; lscpu; systemd-detect-virt || true; head -30 /proc/cpuinfo; } | tee ci-results/platform.txt
          test "$(uname -m)" = "$([ '${{ matrix.runner }}' = ubuntu-24.04-arm ] && echo aarch64 || echo x86_64)"
          ! grep -qi qemu /proc/cpuinfo
      - name: toolchain and BPF prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bpfcc-tools python3-bpfcc libbpf-dev libsqlite3-dev libelf-dev zlib1g-dev \
            pkg-config gcc make clang nodejs npm rsync file dpkg-dev desktop-file-utils linux-headers-$(uname -r)
      - id: tests
        name: unit, model, label, long-history, observation, discovery, redaction and live eBPF tests (root and user)
        continue-on-error: true
        run: |
          sudo env PYTHONPATH=src:tests python3 -m unittest discover -s tests 2>&1 | tee ci-results/tests-root.log
          test ${PIPESTATUS[0]} -eq 0
          PYTHONPATH=src:tests python3 -m unittest discover -s tests 2>&1 | tee ci-results/tests-user.log
          test ${PIPESTATUS[0]} -eq 0
      - name: build the .deb natively for this architecture
        run: bash packaging/linux/build_deb.sh dist
      - id: deb
        name: exact artifact -- package install / systemd service / label without init / file-manager entries / tamper refusal / uninstall / purge
        continue-on-error: true
        run: |
          sudo bash packaging/linux/test_deb.sh dist/whyfs_*.deb runner ci-results/deb-test 2>&1 | tee ci-results/deb-test.log
          grep -q "checks" ci-results/deb-test.log && ! grep -q "^FAIL" ci-results/deb-test.log
      - name: install the .deb (the machine-wide labelling service starts with it)
        run: |
          sudo apt-get install -y -q ./dist/whyfs_*.deb
          for i in $(seq 1 180); do whyfs status --json 2>/dev/null | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)["collector_ready"] else 1)' && break; sleep 1; done
          whyfs status | tee ci-results/status-after-install.txt
      - id: product
        name: product gate (no init; A-H; agents; privacy; file-manager entries; WhyFS window; search; impact; UI/API/CLI same label)
        continue-on-error: true
        run: sudo python3 scripts/product_gate.py --installed --user runner --out ci-results/product-gate
      - id: outage
        name: observation integrity (forced outage; automatic recovery; A complete, B unknown, C complete)
        continue-on-error: true
        run: sudo python3 scripts/outage_gate.py --user runner --out ci-results/outage-gate
      - id: corpus_machine
        name: shared A-H corpus through the machine collector (no workspace)
        continue-on-error: true
        run: sudo env -u PYTHONPATH python3 scripts/run_corpus.py --installed --machine --user runner --out ci-results/corpus-machine
      - id: corpus_workspace
        name: shared A-H corpus (explicit workspace capture, source tree)
        continue-on-error: true
        run: sudo python3 scripts/run_corpus.py --user runner --out ci-results/corpus
      - id: secret
        name: live secret-redaction gate
        continue-on-error: true
        run: sudo python3 scripts/secret_gate.py --user runner --out ci-results/secret-gate
      - id: label_latency
        name: long-history label gate (1..5000 generations; label/why < 100 ms; near-flat; latest creator; complete history)
        continue-on-error: true
        run: sudo python3 scripts/label_latency_gate.py --user runner --out ci-results/label-latency 2>&1 | grep -v '^generation' | tee ci-results/label-latency.log; test ${PIPESTATUS[0]} -eq 0
      - name: service journal and store status
        if: always()
        run: |
          sudo journalctl -u whyfs.service --no-pager > ci-results/whyfs-journal.txt 2>&1 || true
          whyfs status --json > ci-results/status-final.json 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" ci-results || true
      - name: checksums
        if: always()
        run: cd dist && sha256sum * > SHA256SUMS || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "linux-${{ matrix.runner }}", path: "ci-results/\ndist/" }
      - name: verdict
        if: always()
        env:
          OUTCOMES: >-
            tests=${{ steps.tests.outcome }} deb=${{ steps.deb.outcome }} product=${{ steps.product.outcome }}
            outage=${{ steps.outage.outcome }} corpus_machine=${{ steps.corpus_machine.outcome }}
            corpus_workspace=${{ steps.corpus_workspace.outcome }} secret=${{ steps.secret.outcome }}
            label_latency=${{ steps.label_latency.outcome }}
        run: |
          echo "$OUTCOMES" | tr ' ' '\n'
          ! echo "$OUTCOMES" | tr ' ' '\n' | grep -v '=success$' | grep -q .

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, arch: x64, vcvars: vcvars64.bat, wmi_arch: 9 }
          - { runner: windows-11-arm, arch: arm64, vcvars: vcvarsarm64.bat, wmi_arch: 12 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      PYTHONPATH: "src;tests"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5          # msilib host for make_msi.py
        id: py312
        with: { python-version: "3.12", architecture: "${{ matrix.arch }}" }
      - uses: actions/setup-python@v5          # the runtime bundled into the MSI, and the test interpreter
        id: py313
        with: { python-version: "3.13", architecture: "${{ matrix.arch }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", architecture: "${{ matrix.arch }}" }
      - name: platform identity (must be native, not emulated)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1 Name, Architecture, NumberOfCores
          $os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          $py = python -c "import platform, sys; print(platform.machine(), sys.version)"
          "$($cpu | Format-List | Out-String)$($os | Format-List | Out-String)python: $py" | Tee-Object ci-results\platform.txt
          if ($cpu.Architecture -ne ${{ matrix.wmi_arch }}) { throw "not a native ${{ matrix.arch }} processor" }
          if ("${{ matrix.arch }}" -eq "arm64" -and -not ($py -match "^ARM64 ")) { throw "python is not native ARM64: $py" }
      - name: locate MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          "VSROOT=$vs" >> $env:GITHUB_ENV
          "WHYFS_VCVARS=$vs\VC\Auxiliary\Build\${{ matrix.vcvars }}" >> $env:GITHUB_ENV
      - name: build collector and service (MSVC, native arch)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File native\windows\build.ps1 -Arch ${{ matrix.arch }} -VsRoot $env:VSROOT
      - name: standard-user helper for the installer test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\whyfs-tools | Out-Null
          cmd /c "`"$env:WHYFS_VCVARS`" >nul && cl /nologo /O2 native\windows\tools\asuser.c /Fe:C:\whyfs-tools\asuser.exe /Fo:C:\whyfs-tools\ advapi32.lib"
      - id: tests
        name: Windows model, query, label, long-history, observation, discovery and redaction-parity tests
        continue-on-error: true
        shell: pwsh
        run: |
          python -m unittest discover -s tests 2>&1 | Tee-Object ci-results\tests.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: MSIs (this version, and a lower version for the upgrade test)
        shell: pwsh
        run: |
          $rt = Split-Path "${{ steps.py313.outputs.python-path }}"
          & "${{ steps.py312.outputs.python-path }}" native\windows\make_msi.py --arch ${{ matrix.arch }} --runtime $rt --vcvars $env:WHYFS_VCVARS --out dist
          & "${{ steps.py312.outputs.python-path }}" native\windows\make_msi.py --arch ${{ matrix.arch }} --runtime $rt --vcvars $env:WHYFS_VCVARS --version 0.9.0.dev0 --out dist-old
      - id: msi
        name: exact artifact -- MSI clean install, service, standard-user flow, Explorer menu, Start menu, uninstall
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File native\windows\test_msi.ps1 -Msi (Get-ChildItem dist\*.msi).FullName -Out ci-results\msi-test -AsUser C:\whyfs-tools\asuser.exe 2>&1 | Tee-Object ci-results\msi-test.log
          if (Select-String -Path ci-results\msi-test.log -Pattern "^FAIL" -Quiet) { exit 1 }
      - id: upgrade
        name: exact artifact -- MSI upgrade (store kept, no migration), downgrade refusal, data retention
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File native\windows\test_msi_upgrade.ps1 -Old (Get-ChildItem dist-old\*.msi).FullName -New (Get-ChildItem dist\*.msi).FullName -Out ci-results\msi-upgrade 2>&1 | Tee-Object ci-results\msi-upgrade.log
          if (Select-String -Path ci-results\msi-upgrade.log -Pattern "^FAIL" -Quiet) { exit 1 }
      - name: Vite fixture template (the functional gate builds a Vite project)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\whyfs-vite-template | Out-Null
          Set-Content C:\whyfs-vite-template\package.json '{"name":"whyfs-vite-fixture","private":true,"type":"module"}'
          Push-Location C:\whyfs-vite-template; npm install --no-audit --no-fund vite@5.4.21; Pop-Location
          "WHYFS_VITE_TEMPLATE=C:\whyfs-vite-template" >> $env:GITHUB_ENV
      - name: install the MSI (the machine-wide labelling service starts with it)
        shell: pwsh
        run: |
          Start-Process msiexec.exe -ArgumentList "/i `"$((Get-ChildItem dist\*.msi).FullName)`" /qn /norestart /l*v `"$PWD\ci-results\install.log`"" -Wait
          for ($i = 0; $i -lt 180; $i++) { try { if ((& "$env:ProgramFiles\whyfs\whyfs.exe" status --json | ConvertFrom-Json).collector_ready) { break } } catch {}; Start-Sleep 1 }
          & "$env:ProgramFiles\whyfs\whyfs.exe" status | Tee-Object ci-results\status-after-install.txt
      - id: product
        name: product gate (no init; A-H; agents; privacy; Explorer verbs run headless; WhyFS window; search; impact; UI/API/CLI same label)
        continue-on-error: true
        run: python scripts\product_gate.py --installed --out ci-results\product-gate
      - id: outage
        name: observation integrity (forced outage; automatic recovery; A complete, B unknown, C complete)
        continue-on-error: true
        run: python scripts\outage_gate.py --out ci-results\outage-gate
      - id: corpus_machine
        name: shared A-H corpus through the machine collector (no workspace)
        continue-on-error: true
        run: python scripts\run_corpus.py --machine --out ci-results\corpus-machine
      - id: corpus_workspace
        name: shared A-H corpus (explicit workspace capture)
        continue-on-error: true
        run: python scripts\run_corpus.py --out ci-results\corpus
      - id: secret
        name: live secret-redaction gate
        continue-on-error: true
        run: python scripts\secret_gate.py --installed --out ci-results\secret-gate
      - id: functional
        name: functional fixture gate (native exe, PowerShell, Python, Node/Vite, MSVC, mmap, rename, parallel, parent/child)
        continue-on-error: true
        run: python scripts\win_gate.py --out ci-results\win-gate --skip-perf
      - id: label_latency
        name: long-history label gate (1..5000 generations; label/why < 100 ms; near-flat; latest creator; complete history)
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts\label_latency_gate.py --out ci-results\label-latency 2>&1 | Where-Object { $_ -notmatch '^generation' } | Tee-Object ci-results\label-latency.log
          if ((Get-Content ci-results\label-latency\label_latency.json -Raw | ConvertFrom-Json).verdict -ne "PASS") { exit 1 }
      - name: service logs and store status
        if: always()
        shell: pwsh
        run: |
          Copy-Item "$env:ProgramData\whyfs\logs" ci-results\service-logs -Recurse -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\whyfs\whyfs.exe" status --json > ci-results\status-final.json 2>&1
      - name: checksums
        if: always()
        shell: pwsh
        run: Get-ChildItem dist\*.msi | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist\SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "windows-${{ matrix.arch }}", path: "ci-results/\ndist/" }
      - name: verdict
        if: always()
        shell: pwsh
        env:
          OUTCOMES: >-
            tests=${{ steps.tests.outcome }} msi=${{ steps.msi.outcome }} upgrade=${{ steps.upgrade.outcome }}
            product=${{ steps.product.outcome }} outage=${{ steps.outage.outcome }}
            corpus_machine=${{ steps.corpus_machine.outcome }} corpus_workspace=${{ steps.corpus_workspace.outcome }}
            secret=${{ steps.secret.outcome }} functional=${{ steps.functional.outcome }}
            label_latency=${{ steps.label_latency.outcome }}
        run: |
          $o = $env:OUTCOMES -split '\s+' | Where-Object { $_ }
          $o
          if ($o | Where-Object { $_ -notmatch '=success$' }) { exit 1 }
